name: Build X APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK X.apk
        run: cp "$(ls app/build/outputs/apk/debug/*.apk | head -n 1)" X.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X-debug-apk
          path: X.apk
          if-no-files-found: error
